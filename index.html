
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Redwan PDF Editor</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lateef&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef2f7;color:#172033;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}

.pdf-editor-container input, 
.pdf-editor-container .text-box, 
.editable-text {
    position: absolute !important;
    line-height: 1.4 !important;
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 2px 4px !important;
    border: none !important;
    outline: none !important;
    background: transparent !important;
    box-shadow: none !important;
}

.pdf-editor-container input:hover, 
.pdf-editor-container input:focus,
.editable-text:focus {
    border: 1px dashed #007bff !important;
    background: rgba(0, 123, 255, 0.08) !important;
};
}
.pdf-canvas { position: relative !important; z-index: 1 !important; }
.text-layer, .overlay-layer { position: absolute !important; top: 0; left: 0; z-index: 10 !important; }
.form-row, .input-group { display: flex !important; align-items: center !important; gap: 8px !important; clear: both !important; }
  
.header{
 height:64px;background:#fff;border-bottom:1px solid #dbe3ec;
 display:flex;align-items:center;justify-content:space-between;padding:0 18px;
 position:sticky;top:0;z-index:1000
}
.logo{font-size:22px;font-weight:800;white-space:nowrap}
.logo span{color:#2563eb}
.status{font-size:13px;color:#64748b}

.toolbar-wrap{
 background:#fff;border-bottom:1px solid #dbe3ec;padding:9px 10px;
 position:sticky;top:64px;z-index:999
}
.toolbar-scroll{overflow-x:auto;overflow-y:hidden;width:100%}
.toolbar{display:flex;align-items:center;gap:7px;width:max-content;min-width:100%;white-space:nowrap}

.tool{
 height:40px;border:0;border-radius:9px;padding:0 13px;
 display:inline-flex;align-items:center;justify-content:center;gap:7px;
 color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex:none;
 box-shadow:0 2px 6px rgba(15,23,42,.10);transition:.16s
}
.tool:hover{transform:translateY(-1px);filter:brightness(1.05)}
.tool:active{transform:scale(.97)}
.tool.active{outline:3px solid rgba(15,23,42,.16)}

.add{background:#16a34a}
.edit{background:#2563eb}
.image{background:#9333ea}
.draw{background:#ea580c}
.undo{background:#64748b}
.redo{background:#be123c}
.rotate{background:#0891b2}
.fontbox{background:#7c3aed}
.sizebox{background:#db2777}
.zoom{background:#334155}
.save{background:#059669}

select.tool{appearance:auto}
.font-select{min-width:150px}
.size-select{min-width:76px}

.zoom-value{
 height:40px;min-width:60px;border-radius:9px;background:#0f172a;
 color:#fff;display:inline-flex;align-items:center;justify-content:center;
 font-size:13px;font-weight:700;flex:none
}

.drawing-panel{
 display:none;align-items:center;gap:6px;padding-left:5px
}
.drawing-panel.show{display:flex}
.subtool{
 height:38px;border:0;border-radius:8px;padding:0 10px;
 color:#fff;font-weight:700;cursor:pointer
}
.pen{background:#f97316}
.eraser{background:#dc2626}
.draw-size{background:#0d9488}
.draw-color{
 width:40px;padding:4px;background:#1e293b
}
.draw-color input{width:28px;height:27px;border:0;padding:0;cursor:pointer}

.workspace{padding:28px;min-height:calc(100vh - 120px)}
.empty{min-height:65vh;display:flex;align-items:center;justify-content:center}
.empty-card{
 background:#fff;border:1px solid #dbe3ec;border-radius:18px;
 padding:50px 60px;text-align:center;box-shadow:0 12px 40px rgba(15,23,42,.08)
}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-card h2{margin:0 0 8px}
.empty-card p{margin:0;color:#64748b}

.pages{display:flex;flex-direction:column;align-items:center;gap:28px}

.page-holder{
 position:relative;background:#fff;
 box-shadow:0 8px 30px rgba(15,23,42,.15);
 overflow:hidden;flex:none
}
.page-canvas{display:block;background:#fff}

.text-layer,.object-layer{
 position:absolute;left:0;top:0;width:100%;height:100%
}

.text-layer{pointer-events:none}
.pdf-text{
 position:absolute;pointer-events:none;white-space:pre;
 color:transparent;background:transparent;border:0;
 margin:0;padding:0;line-height:1;overflow:visible
}
.editing .pdf-text{
 pointer-events:auto;color:#111827;background:rgba(255,255,255,.96);
 border:1px solid #2563eb;border-radius:3px;padding:2px 4px;
 cursor:text;z-index:30;outline:none
}
.editing .pdf-text:hover{
 box-shadow:0 0 0 2px rgba(37,99,235,.12)
}
.pdf-text:focus{
 border:2px solid #2563eb;
 box-shadow:0 0 0 3px rgba(37,99,235,.12)
}

.new-text{
 position:absolute;z-index:60;min-width:60px;min-height:24px;
 padding:2px 5px;background:#fff;border:1px dashed #2563eb;
 border-radius:3px;outline:none;white-space:pre-wrap
}

.image-object{
 position:absolute;z-index:70;border:1px dashed transparent;cursor:move
}
.image-object.selected{border:2px solid #9333ea}
.image-object img{
 display:block;width:100%;height:100%;object-fit:contain;pointer-events:none
}
.resize-handle{
 display:none;position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;
 background:#9333ea;border:2px solid #fff;border-radius:50%;cursor:nwse-resize
}
.image-object.selected .resize-handle{display:block}

.drawing-canvas{
 position:absolute;left:0;top:0;z-index:80;
 width:100%;height:100%;pointer-events:none
}
.drawing-canvas.active{pointer-events:auto;cursor:crosshair}

.notice{
 position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;
 padding:11px 15px;border-radius:9px;font-size:13px;
 opacity:0;transform:translateY(10px);pointer-events:none;
 transition:.2s;z-index:5000
}
.notice.show{opacity:1;transform:translateY(0)}

.save-ok{
 display:inline-flex!important;
 align-items:center!important;
 justify-content:center!important;
 gap:6px!important
}

@media(max-width:700px){
 .header{height:56px;padding:0 12px}
 .logo{font-size:18px}
 .status{display:none}
 .toolbar-wrap{top:56px}
 .workspace{padding:12px}
 .empty-card{padding:35px 22px}
}

.tool, 
.toolbar button, 
.toolbar label,
.toolbar select {
  font-size: 13px !important;
  height: 38px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  line-height: 1 !important;
}
</style>
</head>

<body>

<header class="header">
 <div class="logo">Redwan <span>PDF Editor</span></div>
 <div class="status" id="status">Ready</div>
</header>

<div class="toolbar-wrap">
 <div class="toolbar-scroll">
  <div class="toolbar">

   <label class="tool add">
    📂 Add File
    <input id="fileInput" hidden type="file" accept=".pdf,.jpg,.jpeg,.png,.webp">
   </label>

   <button class="tool edit" id="editBtn">📝 Edit Text</button>

   <label class="tool image">
    🖼️ Image
    <input id="imageInput" hidden type="file" accept="image/*">
   </label>

   <button class="tool draw" id="drawBtn">🖊️ Drawing</button>

   <div class="drawing-panel" id="drawingPanel">
    <button class="subtool pen" id="penBtn">🖊 Pen</button>
    <button class="subtool eraser" id="eraserBtn">🧽 Eraser</button>

    <select class="subtool draw-size" id="drawSize">
     <option value="2">2 px</option>
     <option value="4" selected>4 px</option>
     <option value="6">6 px</option>
     <option value="10">10 px</option>
     <option value="16">16 px</option>
     <option value="24">24 px</option>
     <option value="32">32 px</option>
    </select>

    <label class="subtool draw-color">
     🎨
     <input id="drawColor" type="color" value="#111111">
    </label>
   </div>

   <button class="tool undo" id="undoBtn">↶ Undo</button>
   <button class="tool redo" id="redoBtn">↷ Redo</button>
   <button class="tool rotate" id="rotateBtn">🔄 Rotate</button>

   <select class="tool fontbox font-select" id="fontSelect">
    <optgroup label="English / Latin">
     <option>Arial</option>
     <option>Helvetica</option>
     <option>Times New Roman</option>
     <option>Georgia</option>
     <option>Verdana</option>
     <option>Tahoma</option>
     <option>Courier New</option>
     <option>Calibri</option>
     <option>Cambria</option>
     <option>Garamond</option>
     <option>Trebuchet MS</option>
    </optgroup>

    <optgroup label="বাংলা">
     <option>Noto Sans Bengali</option>
     <option>Noto Serif Bengali</option>
     <option>SolaimanLipi</option>
     <option>Kalpurush</option>
     <option>Siyam Rupali</option>
    </optgroup>

    <optgroup label="العربية">
     <option>Noto Sans Arabic</option>
     <option>Noto Naskh Arabic</option>
     <option>Amiri</option>
     <option>Cairo</option>
     <option>Tajawal</option>
     <option>Scheherazade New</option>
     <option>Lateef</option>
     <option>IBM Plex Sans Arabic</option>
     <option>Almarai</option>
    </optgroup>
   </select>

   <select class="tool sizebox size-select" id="sizeSelect">
    <option>8</option><option>9</option><option>10</option>
    <option>11</option><option selected>12</option><option>13</option>
    <option>14</option><option>16</option><option>18</option>
    <option>20</option><option>22</option><option>24</option>
    <option>28</option><option>32</option><option>36</option>
    <option>40</option><option>48</option><option>60</option>
    <option>72</option>
   </select>

   <button class="tool zoom" id="zoomOut">−</button>
   <div class="zoom-value" id="zoomValue">100%</div>
   <button class="tool zoom" id="zoomIn">+</button>

   <button class="tool save" id="saveBtn">💾 Save</button>

  </div>
 </div>
</div>

<main class="workspace">

 <div class="empty" id="emptyState">
  <div class="empty-card">
   <div class="empty-icon">📄</div>
   <h2>Free Edit your PDF</h2>
   <p>Click <b>📂 Add File</b> to open your PDF.</p>
  </div>
 </div>

 <div class="pages" id="pages"></div>

</main>

<div class="notice" id="notice"></div>

<script>
const S={
 pdf:null,
 originalBytes:null,
 pages:[],
 zoom:1,
 rotation:0,
 edit:false,
 drawing:false,
 drawMode:"pen",
 selectedImage:null,
 history:[],
 future:[],
 activeText:null
};

const $=id=>document.getElementById(id);

const pagesEl=$("pages");
const emptyState=$("emptyState");
const statusEl=$("status");
const noticeEl=$("notice");

function toast(msg){
 noticeEl.textContent=msg;
 noticeEl.classList.add("show");
 clearTimeout(window.__toast);
 window.__toast=setTimeout(
  ()=>noticeEl.classList.remove("show"),1800
 );
}

function status(msg){
 statusEl.textContent=msg;
}

function clone(obj){
 return JSON.parse(JSON.stringify(obj));
}

function snapshot(){
 return clone({
  pages:S.pages,
  rotation:S.rotation
 });
}

function pushHistory(){
 S.history.push(snapshot());
 if(S.history.length>40)S.history.shift();
 S.future=[];
}

function restoreSnap(snap){
 S.pages=clone(snap.pages);
 S.rotation=snap.rotation;
 renderAll();
}

$("fileInput").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;

 if(!file.name.toLowerCase().endsWith(".pdf")){
  toast("Please choose a PDF file");
  return;
 }

 try{
  status("Opening PDF...");

  S.originalBytes=new Uint8Array(await file.arrayBuffer());

  S.pdf=await pdfjsLib.getDocument({
   data:S.originalBytes.slice()
  }).promise;

  S.pages=[];
  S.history=[];
  S.future=[];
  S.rotation=0;
  S.zoom=1;

  for(let i=0;i<S.pdf.numPages;i++){
   S.pages.push({
    texts:[],
    newTexts:[],
    images:[],
    strokes:[]
   });
  }

  emptyState.style.display="none";

  await renderAll();

  status("PDF loaded");
  toast("PDF opened");

 }catch(err){
  console.error(err);
  status("Open failed");
  toast("PDF could not be opened");
 }
});

async function renderAll(){

 pagesEl.innerHTML="";

 if(!S.pdf)return;

 for(let n=1;n<=S.pdf.numPages;n++){
  await renderPage(n);
 }

 $("zoomValue").textContent=Math.round(S.zoom*100)+"%";
}

async function renderPage(n){

 const page=await S.pdf.getPage(n);

 const base=page.getViewport({
  scale:1,
  rotation:S.rotation
 });

 const view=page.getViewport({
  scale:S.zoom,
  rotation:S.rotation
 });

 const holder=document.createElement("div");
 holder.className="page-holder";
 holder.dataset.page=n;

 holder.style.width=view.width+"px";
 holder.style.height=view.height+"px";

 const canvas=document.createElement("canvas");
 canvas.className="page-canvas";
 canvas.width=Math.ceil(view.width);
 canvas.height=Math.ceil(view.height);
 canvas.style.width=view.width+"px";
 canvas.style.height=view.height+"px";

 await page.render({
  canvasContext:canvas.getContext("2d"),
  viewport:view
 }).promise;

 holder.appendChild(canvas);

 const textLayer=document.createElement("div");
 textLayer.className="text-layer";
 holder.appendChild(textLayer);

 const objectLayer=document.createElement("div");
 objectLayer.className="object-layer";
 holder.appendChild(objectLayer);

 const ps=S.pages[n-1];

 const content=await page.getTextContent();

 content.items.forEach((item,index)=>{

  if(!item.str)return;

  const t=item.transform;

  const x=t[4];
  const y=t[5];

  const rawSize=Math.abs(t[3])||Math.abs(item.height)||12;

  const edited=ps.texts.find(x=>x.index===index);

  const el=document.createElement("div");
  el.className="pdf-text";
  el.dataset.page=n;
  el.dataset.index=index;

  el.textContent=edited?edited.text:item.str;

  el.style.left=(x*S.zoom-4)+"px";
  el.style.top=(y*S.zoom-rawSize*S.zoom-3)+"px";

  el.style.fontSize=(edited?.size||rawSize)*S.zoom+"px";

  el.style.fontFamily=
   edited?.font ||
   "Arial, sans-serif";

  const width=Math.max(
   22,
   (item.width||Math.max(20,item.str.length*rawSize*.45))
  );

  el.style.minWidth=(width*S.zoom+8)+"px";
  el.style.minHeight=(rawSize*S.zoom+8)+"px";

  el.contentEditable="false";

  el.addEventListener("click",e=>{
   if(!S.edit)return;
   e.stopPropagation();
   activateText(el);
  });

  el.addEventListener("input",()=>{
   if(!S.edit)return;
   saveExistingText(el);
  });

  el.addEventListener("keydown",e=>{
   if(e.key==="Escape")el.blur();
  });

  textLayer.appendChild(el);
 });

 ps.newTexts.forEach(obj=>{
  createNewText(holder,n,obj);
 });

 ps.images.forEach(obj=>{
  createImage(holder,n,obj);
 });

 if(ps.strokes.length){
  const dc=document.createElement("canvas");
  dc.className="drawing-canvas";
  dc.width=Math.ceil(view.width);
  dc.height=Math.ceil(view.height);
  dc.style.width=view.width+"px";
  dc.style.height=view.height+"px";

  holder.appendChild(dc);

  redrawStrokes(dc,ps.strokes);
  setupDrawing(dc,n);
 }

 holder.addEventListener("dblclick",e=>{

  if(!S.edit)return;

  if(
   e.target.classList.contains("pdf-text") ||
   e.target.classList.contains("new-text") ||
   e.target.classList.contains("image-object")
  )return;

  const r=holder.getBoundingClientRect();

  const obj={
   id:"new_"+Date.now()+"_"+Math.random(),
   x:(e.clientX-r.left)/S.zoom,
   y:(e.clientY-r.top)/S.zoom,
   text:"",
   font:$("fontSelect").value,
   size:Number($("sizeSelect").value)
  };

  pushHistory();

  ps.newTexts.push(obj);

  createNewText(holder,n,obj);

  setTimeout(()=>{
   const el=holder.querySelector(
    `[data-new-id="${obj.id}"]`
   );
   if(el)el.focus();
  },20);
 });

 pagesEl.appendChild(holder);

 if(S.edit)holder.classList.add("editing");
}

function activateText(el){

 if(S.activeText && S.activeText!==el){
  S.activeText.blur();
 }

 S.activeText=el;
 el.contentEditable="true";
 el.focus();

 const range=document.createRange();
 range.selectNodeContents(el);
 range.collapse(false);

 const sel=window.getSelection();
 sel.removeAllRanges();
 sel.addRange(range);
}

function saveExistingText(el){

 const page=Number(el.dataset.page);
 const index=Number(el.dataset.index);

 const ps=S.pages[page-1];

 let obj=ps.texts.find(t=>t.index===index);

 if(!obj){
  pushHistory();

  obj={
   index,
   text:"",
   font:"Arial",
   size:12
  };

  ps.texts.push(obj);
 }

 obj.text=el.innerText.replace(/\n/g,"");
 obj.font=$("fontSelect").value;
 obj.size=Number($("sizeSelect").value);

 autoSave();
}

function autoSave(){
 try{
  localStorage.setItem(
   "redwan_pdf_editor_state",
   JSON.stringify({
    pages:S.pages,
    rotation:S.rotation
   })
  );
 }catch(e){}
}

$("editBtn").addEventListener("click",()=>{

 if(!S.pdf){
  toast("Open a PDF first");
  return;
 }

 S.edit=!S.edit;

 $("editBtn").classList.toggle("active",S.edit);

 document.querySelectorAll(".page-holder").forEach(h=>{
  h.classList.toggle("editing",S.edit);
 });

 if(S.edit){
  status("Edit Text ON");
  toast("Click any text box to edit");
 }else{
  if(S.activeText)S.activeText.blur();
  S.activeText=null;
  status("Ready");
 }
});

$("fontSelect").addEventListener("change",()=>{

 if(!S.activeText)return;

 pushHistory();

 S.activeText.style.fontFamily=$("fontSelect").value;

 saveExistingText(S.activeText);
});

$("sizeSelect").addEventListener("change",()=>{

 if(!S.activeText)return;

 pushHistory();

 S.activeText.style.fontSize=
  Number($("sizeSelect").value)*S.zoom+"px";

 saveExistingText(S.activeText);
});

function createNewText(holder,n,obj){

 const el=document.createElement("div");

 el.className="new-text";
 el.dataset.newId=obj.id;
 el.contentEditable="true";

 el.textContent=obj.text||"";

 el.style.left=obj.x*S.zoom+"px";
 el.style.top=obj.y*S.zoom+"px";

 el.style.fontFamily=obj.font||"Arial";
 el.style.fontSize=(obj.size||12)*S.zoom+"px";

 el.addEventListener("input",()=>{
  obj.text=el.innerText;
  autoSave();
 });

 el.addEventListener("focus",()=>{
  S.activeText=el;
 });

 el.addEventListener("keydown",e=>{
  if(e.key==="Escape")el.blur();
 });

 holder.querySelector(".object-layer").appendChild(el);
}

$("imageInput").addEventListener("change",async e=>{

 const file=e.target.files[0];

 if(!file||!S.pdf)return;

 pushHistory();

 const ps=S.pages[0];

 const obj={
  id:"img_"+Date.now(),
  src:URL.createObjectURL(file),
  x:60,
  y:60,
  width:180,
  height:130
 };

 ps.images.push(obj);

 const holder=document.querySelector(
  '.page-holder[data-page="1"]'
 );

 if(holder)createImage(holder,1,obj);

 autoSave();
 toast("Image added");
});

function createImage(holder,n,obj){

 const box=document.createElement("div");

 box.className="image-object";
 box.dataset.imageId=obj.id;

 box.style.left=obj.x*S.zoom+"px";
 box.style.top=obj.y*S.zoom+"px";
 box.style.width=obj.width*S.zoom+"px";
 box.style.height=obj.height*S.zoom+"px";

 const img=document.createElement("img");
 img.src=obj.src;

 const handle=document.createElement("div");
 handle.className="resize-handle";

 box.appendChild(img);
 box.appendChild(handle);

 box.addEventListener("mousedown",e=>{

  if(e.target===handle)return;

  selectImage(box);

  const sx=e.clientX;
  const sy=e.clientY;
  const ox=obj.x;
  const oy=obj.y;

  function move(ev){

   obj.x=ox+(ev.clientX-sx)/S.zoom;
   obj.y=oy+(ev.clientY-sy)/S.zoom;

   box.style.left=obj.x*S.zoom+"px";
   box.style.top=obj.y*S.zoom+"px";
  }

  function up(){

   document.removeEventListener("mousemove",move);
   document.removeEventListener("mouseup",up);

   autoSave();
  }

  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
 });

 handle.addEventListener("mousedown",e=>{

  e.stopPropagation();

  pushHistory();

  const sx=e.clientX;
  const sy=e.clientY;

  const ow=obj.width;
  const oh=obj.height;

  function move(ev){

   const nw=Math.max(
    30,
    ow+(ev.clientX-sx)/S.zoom
   );

   const ratio=oh/ow;

   obj.width=nw;
   obj.height=nw*ratio;

   box.style.width=obj.width*S.zoom+"px";
   box.style.height=obj.height*S.zoom+"px";
  }

  function up(){

   document.removeEventListener("mousemove",move);
   document.removeEventListener("mouseup",up);
   autoSave();
  }

  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);

 });

 holder.querySelector(".object-layer").appendChild(box);
}

function selectImage(el){

 document.querySelectorAll(".image-object")
 .forEach(x=>x.classList.remove("selected"));

 el.classList.add("selected");

 S.selectedImage=el;
}

$("drawBtn").addEventListener("click",()=>{

 if(!S.pdf){
  toast("Open a PDF first");
  return;
 }

 S.drawing=!S.drawing;

 $("drawBtn").classList.toggle("active",S.drawing);

 $("drawingPanel").classList.toggle(
  "show",
  S.drawing
 );

 document.querySelectorAll(".drawing-canvas")
 .forEach(c=>c.classList.toggle("active",S.drawing));

 if(S.drawing){

  S.edit=false;
  $("editBtn").classList.remove("active");

  document.querySelectorAll(".page-holder")
  .forEach(h=>h.classList.remove("editing"));

  status("Drawing ON");
  toast("Pen ready");

 }else{

  status("Ready");
 }
});

$("penBtn").addEventListener("click",()=>{
 S.drawMode="pen";
 $("penBtn").classList.add("active");
 $("eraserBtn").classList.remove("active");
 toast("Pen selected");
});

$("eraserBtn").addEventListener("click",()=>{
 S.drawMode="eraser";
 $("eraserBtn").classList.add("active");
 $("penBtn").classList.remove("active");
 toast("Eraser selected");
});

function setupDrawing(canvas,n){

 let drawing=false;
 let current=null;

 function point(e){

  const r=canvas.getBoundingClientRect();

  return {
   x:(e.clientX-r.left)/S.zoom,
   y:(e.clientY-r.top)/S.zoom
  };
 }

 canvas.addEventListener("pointerdown",e=>{

  if(!S.drawing)return;

  e.preventDefault();

  drawing=true;

  current={
   mode:S.drawMode,
   color:$("drawColor").value,
   size:Number($("drawSize").value),
   points:[point(e)]
  };

  pushHistory();

  canvas.setPointerCapture(e.pointerId);
 });

 canvas.addEventListener("pointermove",e=>{

  if(!drawing||!current)return;

  current.points.push(point(e));

  redrawStrokes(
   canvas,
   S.pages[n-1].strokes.concat([current])
  );
 });

 canvas.addEventListener("pointerup",e=>{

  if(!drawing||!current)return;

  drawing=false;

  S.pages[n-1].strokes.push(current);

  current=null;

  redrawStrokes(
   canvas,
   S.pages[n-1].strokes
  );

  autoSave();
 });

 canvas.addEventListener("pointercancel",()=>{
  drawing=false;
  current=null;
 });
}

function redrawStrokes(canvas,strokes){

 const ctx=canvas.getContext("2d");

 ctx.clearRect(
  0,0,canvas.width,canvas.height
 );

 ctx.lineCap="round";
 ctx.lineJoin="round";

 strokes.forEach(st=>{

  if(!st.points.length)return;

  ctx.beginPath();

  ctx.moveTo(
   st.points[0].x*S.zoom,
   st.points[0].y*S.zoom
  );

  for(let i=1;i<st.points.length;i++){

   ctx.lineTo(
    st.points[i].x*S.zoom,
    st.points[i].y*S.zoom
   );
  }

  ctx.lineWidth=st.size*S.zoom;

  if(st.mode==="eraser"){

   ctx.globalCompositeOperation="destination-out";

  }else{

   ctx.globalCompositeOperation="source-over";
   ctx.strokeStyle=st.color;
  }

  ctx.stroke();
 });

 ctx.globalCompositeOperation="source-over";
}

$("undoBtn").addEventListener("click",()=>{

 if(!S.history.length){
  toast("Nothing to undo");
  return;
 }

 S.future.push(snapshot());

 const previous=S.history.pop();

 S.pages=clone(previous.pages);
 S.rotation=previous.rotation;

 renderAll();

 toast("Undo");
});

$("redoBtn").addEventListener("click",()=>{

 if(!S.future.length){
  toast("Nothing to redo");
  return;
 }

 S.history.push(snapshot());

 const next=S.future.pop();

 S.pages=clone(next.pages);
 S.rotation=next.rotation;

 renderAll();

 toast("Redo");
});

$("rotateBtn").addEventListener("click",()=>{

 if(!S.pdf){
  toast("Open a PDF first");
  return;
 }

 pushHistory();

 S.rotation=(S.rotation+90)%360;

 renderAll();

 autoSave();

 toast("Rotated 90°");
});

function setZoom(z){

 z=Math.max(.5,Math.min(3,z));

 S.zoom=z;

 renderAll();

 $("zoomValue").textContent=
  Math.round(z*100)+"%";
}

$("zoomIn").addEventListener("click",()=>{
 setZoom(S.zoom+.1);
});

$("zoomOut").addEventListener("click",()=>{
 setZoom(S.zoom-.1);
});

document.addEventListener("keydown",e=>{

 if(e.key!=="Delete"&&e.key!=="Backspace")return;

 const active=document.activeElement;

 if(
  active &&
  (
   active.isContentEditable ||
   active.tagName==="INPUT" ||
   active.tagName==="TEXTAREA"
  )
 )return;

 if(!S.selectedImage)return;

 const id=S.selectedImage.dataset.imageId;

 for(const ps of S.pages){

  const i=ps.images.findIndex(x=>x.id===id);

  if(i!==-1){

   pushHistory();

   ps.images.splice(i,1);

   S.selectedImage=null;

   renderAll();

   autoSave();

   toast("Image deleted");

   return;
  }
 }
});

$("saveBtn").addEventListener("click",savePDF);

async function savePDF(){

 if(!S.originalBytes){

  toast("Open a PDF first");

  return;
 }

 const btn=$("saveBtn");

 const old=btn.innerHTML;

 try{

  btn.disabled=true;
  btn.innerHTML="⏳ Saving...";
  status("Saving PDF...");

  const pdfDoc=
   await PDFLib.PDFDocument.load(
    S.originalBytes.slice()
   );

  const helvetica=
   await pdfDoc.embedFont(
    PDFLib.StandardFonts.Helvetica
   );

  for(let p=0;p<S.pages.length;p++){

   const pdfPage=pdfDoc.getPage(p);

   const ps=S.pages[p];

   const pageWidth=pdfPage.getWidth();
   const pageHeight=pdfPage.getHeight();

   const pdfjsPage=await S.pdf.getPage(p+1);

   const viewport=pdfjsPage.getViewport({
    scale:1,
    rotation:0
   });

   const sx=pageWidth/viewport.width;
   const sy=pageHeight/viewport.height;

   for(const t of ps.texts){

    const content=
     await pdfjsPage.getTextContent();

    const item=content.items[t.index];

    if(!item)continue;

    const x=item.transform[4]*sx;
    const y=item.transform[5]*sy;

    const oldSize=
     Math.abs(item.transform[3])||12;

    const size=
     Number(t.size)||oldSize;

    const width=
     Math.max(
      item.width*sx+8,
      size*2
     );

    pdfPage.drawRectangle({
     x:x-2,
     y:y-size-2,
     width,
     height:size+6,
     color:PDFLib.rgb(1,1,1)
    });

    if(t.text){

     pdfPage.drawText(t.text,{
      x:x,
      y:y-size,
      size:size,
      font:helvetica,
      color:PDFLib.rgb(0,0,0)
     });
    }
   }

   for(const t of ps.newTexts){

    if(!t.text)continue;

    pdfPage.drawText(
     t.text,
     {
      x:t.x*sx,
      y:pageHeight-(t.y+t.size)*sy,
      size:t.size*sy,
      font:helvetica,
      color:PDFLib.rgb(0,0,0)
     }
    );
   }

   for(const im of ps.images){

    try{

     const response=await fetch(im.src);

     const bytes=
      new Uint8Array(await response.arrayBuffer());

     let embedded;

     if(
      im.src.toLowerCase().includes(".jpg") ||
      im.src.toLowerCase().includes(".jpeg")
     ){

      embedded=
       await pdfDoc.embedJpg(bytes);

     }else{

      embedded=
       await pdfDoc.embedPng(bytes);
     }

     pdfPage.drawImage(
      embedded,
      {
       x:im.x*sx,
       y:pageHeight-(im.y+im.height)*sy,
       width:im.width*sx,
       height:im.height*sy
      }
     );

    }catch(err){

     console.warn("Image export failed",err);
    }
   }

   for(const st of ps.strokes){

    if(st.mode==="eraser")continue;

    const rgb=hexRGB(st.color);

    for(let i=1;i<st.points.length;i++){

     const a=st.points[i-1];
     const b=st.points[i];

     pdfPage.drawLine({
      start:{
       x:a.x*sx,
       y:pageHeight-a.y*sy
      },
      end:{
       x:b.x*sx,
       y:pageHeight-b.y*sy
      },
      thickness:st.size*Math.min(sx,sy),
      color:PDFLib.rgb(rgb.r,rgb.g,rgb.b)
     });
    }
   }
  }

  for(const page of pdfDoc.getPages()){

   page.setRotation(
    PDFLib.degrees(S.rotation)
   );
  }

  const bytes=await pdfDoc.save({
   useObjectStreams:true
  });

  const blob=new Blob(
   [bytes],
   {type:"application/pdf"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="Redwan-PDF-Edited.pdf";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
   ()=>URL.revokeObjectURL(url),
   2000
  );

  btn.innerHTML="✓ Saved";
  btn.classList.add("save-ok");

  status("PDF saved successfully");
  toast("✓ Saved Successfully");

  setTimeout(()=>{
   btn.innerHTML=old;
   btn.classList.remove("save-ok");
   btn.disabled=false;
  },1800);

 }catch(err){

  console.error("PDF SAVE ERROR:",err);

  btn.innerHTML="⚠ Save Failed";
  status("Save failed");

  toast("PDF Save Failed");

  setTimeout(()=>{
   btn.innerHTML=old;
   btn.disabled=false;
  },2200);
 }
}

function hexRGB(hex){

 hex=hex.replace("#","");

 return {
  r:parseInt(hex.substring(0,2),16)/255,
  g:parseInt(hex.substring(2,4),16)/255,
  b:parseInt(hex.substring(4,6),16)/255
 };
}
