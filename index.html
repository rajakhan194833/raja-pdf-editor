<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Raja PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}

/* TOP BAR */
header{
position:sticky;
top:0;
z-index:1000;
width:100%;
background:rgba(255,255,255,.98);
border-bottom:1px solid #dfe5ee;
box-shadow:0 4px 18px rgba(20,35,60,.08);
}

.header-inner{
height:70px;
display:flex;
align-items:center;
gap:18px;
padding:0 18px;
}

.logo{
font-size:20px;
font-weight:800;
white-space:nowrap;
color:#17243a;
}

.logo span{color:#3867ff}

/* TOOLBAR */
.toolbar-wrap{
flex:1;
min-width:0;
overflow-x:auto;
overflow-y:hidden;
scrollbar-width:thin;
}

.toolbar{
display:flex;
align-items:center;
gap:8px;
min-width:max-content;
white-space:nowrap;
padding:5px 2px;
}

.tool{
height:40px;
border:1px solid transparent;
border-radius:11px;
padding:0 13px;
display:inline-flex;
align-items:center;
justify-content:center;
gap:7px;
font-size:13px;
font-weight:700;
cursor:pointer;
user-select:none;
transition:.18s ease;
}

.tool:hover{
transform:translateY(-1px);
box-shadow:0 5px 12px rgba(20,30,50,.12);
}

.tool.active{
box-shadow:0 0 0 3px rgba(60,100,255,.18);
transform:translateY(-1px);
}

.icon{font-size:17px}

.add{
background:#e9f0ff;
color:#2456db;
border-color:#cbd9ff;
}

.edit{
background:#e9f8ef;
color:#17814b;
border-color:#c8ead7;
}

.image{
background:#fff0f7;
color:#c62b73;
border-color:#f3c7dd;
}

.draw{
background:#fff5e6;
color:#b96a00;
border-color:#f2d39e;
}

.undo,.redo{
background:#f1efff;
color:#6846c7;
border-color:#d9d1fb;
}

.rotate{
background:#eaf9fa;
color:#087f89;
border-color:#c7e9ec;
}

.save{
background:#172b4d;
color:#fff;
border-color:#172b4d;
padding-left:16px;
padding-right:16px;
}

.save:hover{background:#243e6b}

/* FONT / SIZE */
.control{
height:40px;
border:1px solid #d8dfeb;
border-radius:11px;
background:#fff;
padding:0 10px;
font-size:13px;
font-weight:700;
color:#26344d;
outline:none;
cursor:pointer;
}

.control:focus{
border-color:#6485ff;
box-shadow:0 0 0 3px rgba(80,110,255,.12);
}

.font-control{min-width:130px}
.size-control{width:72px}

/* ZOOM */
.zoom-group{
display:flex;
align-items:center;
gap:4px;
height:40px;
padding:3px;
border:1px solid #d8dfeb;
border-radius:11px;
background:#fff;
}

.zoom-btn{
width:31px;
height:32px;
border:0;
border-radius:8px;
background:#eef2f8;
color:#34435e;
font-size:18px;
font-weight:800;
cursor:pointer;
}

.zoom-btn:hover{background:#dfe7f5}

.zoom-value{
min-width:52px;
text-align:center;
font-size:12px;
font-weight:800;
color:#4b5870;
}

/* WORKSPACE */
.workspace{
width:100%;
min-height:calc(100vh - 70px);
padding:28px 20px 50px;
}

#pages{
width:100%;
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
}

.empty{
width:min(760px,95%);
margin-top:90px;
padding:55px 25px;
background:#fff;
border:1px solid #e0e6ef;
border-radius:20px;
text-align:center;
box-shadow:0 12px 35px rgba(25,40,65,.08);
}

.empty-title{
font-size:30px;
font-weight:800;
margin-bottom:12px;
color:#17243a;
}

.empty-subtitle{
color:#718096;
font-size:15px;
line-height:1.7;
}

/* PAGE */
.page{
position:relative;
background:#fff;
box-shadow:0 12px 35px rgba(20,35,60,.18);
overflow:hidden;
}

.pdfCanvas{
display:block;
}

.textLayer{
position:absolute;
inset:0;
overflow:hidden;
pointer-events:none;
}

.pdfText{
position:absolute;
white-space:pre;
transform-origin:0 0;
color:transparent;
pointer-events:none;
cursor:text;
}

.edit-mode .pdfText{
pointer-events:auto;
}

.edit-mode .pdfText:hover{
background:rgba(57,105,255,.12);
outline:1px solid rgba(57,105,255,.3);
}

.pdfText[contenteditable="true"]{
color:#111;
background:rgba(255,255,255,.96);
outline:2px solid #4773ff;
border-radius:2px;
z-index:20;
}

/* OVERLAY */
.overlay{
position:absolute;
inset:0;
pointer-events:none;
}

.editText{
position:absolute;
min-width:35px;
min-height:22px;
padding:2px 4px;
background:transparent;
border:1px dashed transparent;
outline:none;
white-space:pre-wrap;
cursor:move;
pointer-events:auto;
}

.editText:hover,
.editText:focus{
border-color:#4773ff;
background:rgba(255,255,255,.78);
}

.imageObj{
position:absolute;
display:block;
max-width:none;
cursor:move;
user-select:none;
pointer-events:auto;
border:1px dashed transparent;
}

.imageObj.selected{
border:2px solid #4773ff;
}

.imageObj img{
display:block;
width:100%;
height:auto;
}

.resize-handle{
position:absolute;
width:11px;
height:11px;
right:-6px;
bottom:-6px;
background:#4773ff;
border:2px solid #fff;
border-radius:50%;
cursor:nwse-resize;
}

/* DRAWING */
.drawingCanvas{
position:absolute;
left:0;
top:0;
z-index:30;
}

/* STATUS */
.status{
position:fixed;
right:16px;
bottom:15px;
z-index:2000;
background:#17243a;
color:#fff;
padding:8px 13px;
border-radius:10px;
font-size:11px;
font-weight:700;
box-shadow:0 7px 20px rgba(0,0,0,.18);
}

/* MOBILE */
@media(max-width:800px){

.header-inner{
height:64px;
padding:0 10px;
gap:10px;
}

.logo{font-size:16px}

.toolbar-wrap{
overflow-x:auto;
}

.tool,.control,.zoom-group{
height:38px;
}

.tool{
padding:0 11px;
font-size:12px;
}

.workspace{
padding:18px 8px 45px;
}

.empty{
margin-top:50px;
}

.empty-title{
font-size:24px;
}
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo">
Raja <span>PDF Editor</span>
</div>

<div class="toolbar-wrap">

<div class="toolbar">

<label class="tool add">
<span class="icon">📂</span>
<span>Add File</span>
<input
id="fileInput"
type="file"
hidden
accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.webp"
>
</label>

<button class="tool edit" id="editTextBtn">
<span class="icon">📝</span>
<span>Edit Text</span>
</button>

<button class="tool image" id="imageBtn">
<span class="icon">🖼️</span>
<span>Image</span>
</button>

<button class="tool draw" id="drawBtn">
<span class="icon">🖊️</span>
<span>Drawing</span>
</button>

<button class="tool undo" id="undoBtn">
<span class="icon">↶</span>
<span>Undo</span>
</button>

<button class="tool redo" id="redoBtn">
<span class="icon">↷</span>
<span>Redo</span>
</button>

<button class="tool rotate" id="rotateBtn">
<span class="icon">🔄</span>
<span>Rotate</span>
</button>

<select class="control font-control" id="fontSelect">
<option value="Arial">🔤 Arial</option>
<option value="Helvetica">Helvetica</option>
<option value="Times New Roman">Times New Roman</option>
<option value="Georgia">Georgia</option>
<option value="Verdana">Verdana</option>
<option value="Tahoma">Tahoma</option>
<option value="Courier New">Courier New</option>
</select>

<select class="control size-control" id="sizeSelect">
<option value="10">10</option>
<option value="12">12</option>
<option value="14" selected>14</option>
<option value="16">16</option>
<option value="18">18</option>
<option value="20">20</option>
<option value="24">24</option>
<option value="28">28</option>
<option value="32">32</option>
<option value="40">40</option>
<option value="48">48</option>
<option value="60">60</option>
</select>

<div class="zoom-group">
<button class="zoom-btn" id="zoomOut">−</button>
<div class="zoom-value" id="zoomValue">100%</div>
<button class="zoom-btn" id="zoomIn">+</button>
</div>

<button class="tool save" id="saveBtn">
<span class="icon">💾</span>
<span>Save</span>
</button>

</div>
</div>
</div>
</header>

<main class="workspace">

<div id="pages">

<div class="empty">

<div class="empty-title">
Free Edit your PDF
</div>

<div class="empty-subtitle">
Open a PDF file to start editing.<br>
Add text, images, drawings and more.
</div>

</div>

</div>

</main>

<div class="status" id="status">
Ready
</div>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

let pdfDocument=null;
let originalPdfBytes=null;

let zoom=1;
let pageRotation=0;

let editMode=false;
let drawingMode=false;

let selectedObject=null;

let history=[];
let redoHistory=[];

const pagesContainer=
document.getElementById("pages");

const fileInput=
document.getElementById("fileInput");

const editTextBtn=
document.getElementById("editTextBtn");

const imageBtn=
document.getElementById("imageBtn");

const drawBtn=
document.getElementById("drawBtn");

const undoBtn=
document.getElementById("undoBtn");

const redoBtn=
document.getElementById("redoBtn");

const rotateBtn=
document.getElementById("rotateBtn");

const fontSelect=
document.getElementById("fontSelect");

const sizeSelect=
document.getElementById("sizeSelect");

const zoomInBtn=
document.getElementById("zoomIn");

const zoomOutBtn=
document.getElementById("zoomOut");

const zoomValue=
document.getElementById("zoomValue");

const saveBtn=
document.getElementById("saveBtn");

const statusBox=
document.getElementById("status");


function status(message){

statusBox.textContent=message;

clearTimeout(window.statusTimer);

window.statusTimer=setTimeout(()=>{
statusBox.textContent="Ready";
},2200);

}


/* FILE */

fileInput.addEventListener("change",async function(){

const file=this.files[0];

if(!file)return;

if(file.type!=="application/pdf"){

alert(
"PDF import is active now.\n\n"+
"Word, Excel and image import/OCR will be added in the next development step."
);

this.value="";
return;
}

try{

status("Opening PDF...");

originalPdfBytes=
await file.arrayBuffer();

pdfDocument=
await pdfjsLib.getDocument({
data:originalPdfBytes
}).promise;

zoom=1;
pageRotation=0;

history=[];
redoHistory=[];

await renderDocument();

status("PDF opened successfully.");

}catch(error){

console.error(error);

alert("Unable to open this PDF file.");

status("Open failed.");
}

});


/* RENDER */

async function renderDocument(){

if(!pdfDocument)return;

pagesContainer.innerHTML="";

for(
let pageNumber=1;
pageNumber<=pdfDocument.numPages;
pageNumber++
){

await renderPage(pageNumber);

}

updateZoomText();

}


/* PAGE */

async function renderPage(pageNumber){

const page=
await pdfDocument.getPage(pageNumber);

const viewport=
page.getViewport({
scale:zoom,
rotation:pageRotation
});

const pageBox=
document.createElement("div");

pageBox.className="page";

pageBox.dataset.pageNumber=
pageNumber;

pageBox.style.width=
viewport.width+"px";

pageBox.style.height=
viewport.height+"px";


const canvas=
document.createElement("canvas");

canvas.className="pdfCanvas";

const ctx=
canvas.getContext("2d");

const pixelRatio=
Math.min(
window.devicePixelRatio||1,
2
);

canvas.width=
viewport.width*pixelRatio;

canvas.height=
viewport.height*pixelRatio;

canvas.style.width=
viewport.width+"px";

canvas.style.height=
viewport.height+"px";

const renderContext={
canvasContext:ctx,
viewport:viewport,
transform:
pixelRatio!==1
?[pixelRatio,0,0,pixelRatio,0,0]
:null
};

await page.render(
renderContext
).promise;

pageBox.appendChild(canvas);


/* TEXT */

const textLayer=
document.createElement("div");

textLayer.className="textLayer";

pageBox.appendChild(textLayer);

await createTextLayer(
page,
viewport,
textLayer
);


/* OVERLAY */

const overlay=
document.createElement("div");

overlay.className="overlay";

pageBox.appendChild(overlay);

pagesContainer.appendChild(pageBox);


/* DRAWING */

createDrawingCanvas(
pageBox,
viewport
);

}


/* TEXT LAYER */

async function createTextLayer(
page,
viewport,
textLayer
){

try{

const textContent=
await page.getTextContent();

for(
const item of textContent.items
){

if(!item.str)continue;

const span=
document.createElement("span");

span.className="pdfText";

span.textContent=item.str;

span.dataset.originalText=
item.str;

span.style.left=
(item.transform[4]*zoom)+"px";

span.style.top=
(
viewport.height-
item.transform[5]*zoom-
item.height*zoom
)+"px";

span.style.fontSize=
Math.max(
6,
item.height*zoom
)+"px";

span.style.fontFamily=
"Arial,sans-serif";

span.style.lineHeight="1";

if(item.width){

span.style.width=
(item.width*zoom)+"px";

}

span.addEventListener(
"click",
function(e){

if(!editMode)return;

e.stopPropagation();

enableExistingTextEditing(
span
);

}
);

textLayer.appendChild(span);

}

}catch(error){

console.error(
"Text layer error:",
error
);

}

}


/* EDIT MODE */

editTextBtn.addEventListener(
"click",
function(){

editMode=!editMode;

editTextBtn.classList.toggle(
"active",
editMode
);

document.body.classList.toggle(
"edit-mode",
editMode
);

drawingMode=false;

drawBtn.classList.remove(
"active"
);

if(editMode){

status(
"Edit Text mode ON — click text"
);

}else{

status(
"Edit Text mode OFF"
);

}

}
);


/* EXISTING TEXT */

function enableExistingTextEditing(span){

span.contentEditable="true";

span.style.color="#111";

span.focus();

placeCaretAtEnd(span);

span.addEventListener(
"blur",
function(){

span.contentEditable="false";

span.style.color="transparent";

},
{once:true}
);

status("Text is editable.");
}


function placeCaretAtEnd(element){

const range=
document.createRange();

const selection=
window.getSelection();

range.selectNodeContents(
element
);

range.collapse(false);

selection.removeAllRanges();

selection.addRange(range);

}


/* IMAGE */

imageBtn.addEventListener(
"click",
addImage
);


function addImage(){

const page=
document.querySelector(".page");

if(!page){

alert("Please open a PDF first.");

return;
}

const picker=
document.createElement("input");

picker.type="file";

picker.accept=
"image/png,image/jpeg,image/webp";

picker.onchange=function(){

const file=this.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=function(e){

const overlay=
page.querySelector(".overlay");

const wrapper=
document.createElement("div");

wrapper.className="imageObj";

wrapper.style.left="80px";

wrapper.style.top="80px";

wrapper.style.width="220px";

const img=
document.createElement("img");

img.src=e.target.result;

const handle=
document.createElement("span");

handle.className=
"resize-handle";

wrapper.appendChild(img);

wrapper.appendChild(handle);

overlay.appendChild(wrapper);

makeImageInteractive(wrapper);

selectObject(wrapper);

saveHistory();

status("Image added.");

};

reader.readAsDataURL(file);

};

picker.click();

}


/* IMAGE MOVE / RESIZE */

function makeImageInteractive(wrapper){

let moving=false;
let resizing=false;

let startX=0;
let startY=0;

let startLeft=0;
let startTop=0;
let startWidth=0;

const handle=
wrapper.querySelector(
".resize-handle"
);


wrapper.addEventListener(
"mousedown",
function(e){

if(e.target===handle)return;

selectObject(wrapper);

moving=true;

startX=e.clientX;
startY=e.clientY;

startLeft=
parseFloat(wrapper.style.left)||0;

startTop=
parseFloat(wrapper.style.top)||0;

e.preventDefault();

}
);


handle.addEventListener(
"mousedown",
function(e){

resizing=true;

startX=e.clientX;

startWidth=
wrapper.getBoundingClientRect().width;

e.stopPropagation();

e.preventDefault();

}
);


document.addEventListener(
"mousemove",
function(e){

if(moving){

const dx=
e.clientX-startX;

const dy=
e.clientY-startY;

wrapper.style.left=
(startLeft+dx)+"px";

wrapper.style.top=
(startTop+dy)+"px";

}

if(resizing){

const dx=
e.clientX-startX;

const newWidth=
Math.max(
40,
startWidth+dx
);

wrapper.style.width=
newWidth+"px";

}

}
);


document.addEventListener(
"mouseup",
function(){

if(moving||resizing){

saveHistory();

}

moving=false;

resizing=false;

}
);

}


/* SELECT */

function selectObject(obj){

document
.querySelectorAll(".selected")
.forEach(el=>{
el.classList.remove("selected");
});

obj.classList.add("selected");

selectedObject=obj;

}


/* DRAWING */

drawBtn.addEventListener(
"click",
function(){

drawingMode=!drawingMode;

drawBtn.classList.toggle(
"active",
drawingMode
);

editMode=false;

editTextBtn.classList.remove(
"active"
);

document.body.classList.remove(
"edit-mode"
);

if(drawingMode){

status("Drawing mode ON.");

}else{

status("Drawing mode OFF.");

}

}
);


/* DRAWING CANVAS */

function createDrawingCanvas(
pageBox,
viewport
){

const canvas=
document.createElement("canvas");

canvas.className=
"drawingCanvas";

canvas.width=
viewport.width;

canvas.height=
viewport.height;

canvas.style.width=
viewport.width+"px";

canvas.style.height=
viewport.height+"px";

canvas.style.pointerEvents=
drawingMode
?"auto"
:"none";

pageBox.appendChild(canvas);

const ctx=
canvas.getContext("2d");

let drawing=false;


canvas.addEventListener(
"pointerdown",
function(e){

if(!drawingMode)return;

drawing=true;

const rect=
canvas.getBoundingClientRect();

ctx.beginPath();

ctx.moveTo(
e.clientX-rect.left,
e.clientY-rect.top
);

e.preventDefault();

}
);


canvas.addEventListener(
"pointermove",
function(e){

if(!drawing)return;

const rect=
canvas.getBoundingClientRect();

ctx.lineTo(
e.clientX-rect.left,
e.clientY-rect.top
);

ctx.strokeStyle="#111";

ctx.lineWidth=3;

ctx.lineCap="round";

ctx.lineJoin="round";

ctx.stroke();

}
);


canvas.addEventListener(
"pointerup",
function(){

if(drawing){

saveHistory();

}

drawing=false;

}
);

}


/* HISTORY */

function saveHistory(){

history.push({
time:Date.now()
});

redoHistory=[];

updateHistoryButtons();

}


function undoAction(){

if(history.length===0){

status("Nothing to undo.");

return;
}

const item=
history.pop();

redoHistory.push(item);

updateHistoryButtons();

status("Undo.");

}


function redoAction(){

if(redoHistory.length===0){

status("Nothing to redo.");

return;
}

const item=
redoHistory.pop();

history.push(item);

updateHistoryButtons();

status("Redo.");

}


undoBtn.addEventListener(
"click",
undoAction
);

redoBtn.addEventListener(
"click",
redoAction
);


function updateHistoryButtons(){

undoBtn.disabled=
history.length===0;

redoBtn.disabled=
redoHistory.length===0;

}


/* ROTATE */

rotateBtn.addEventListener(
"click",
async function(){

if(!pdfDocument){

alert(
"Please open a PDF first."
);

return;
}

pageRotation=
(pageRotation+90)%360;

await renderDocument();

status(
"Page rotated "+pageRotation+"°"
);

}
);


/* FONT */

fontSelect.addEventListener(
"change",
function(){

if(selectedObject){

selectedObject.style.fontFamily=
this.value;

}

status(
"Font: "+this.value
);

}
);


/* SIZE */

sizeSelect.addEventListener(
"change",
function(){

if(selectedObject){

selectedObject.style.fontSize=
this.value+"px";

}

status(
"Size: "+this.value
);

}
);


/* ZOOM */

function updateZoomText(){

zoomValue.textContent=
Math.round(zoom*100)+"%";

}


zoomInBtn.addEventListener(
"click",
async function(){

if(!pdfDocument)return;

zoom=
Math.min(
3,
zoom+.1
);

await renderDocument();

}
);


zoomOutBtn.addEventListener(
"click",
async function(){

if(!pdfDocument)return;

zoom=
Math.max(
.5,
zoom-.1
);

await renderDocument();

}
);


/* DELETE KEY */

document.addEventListener(
"keydown",
function(e){

const active=
document.activeElement;

if(
active &&
(
active.isContentEditable||
active.tagName==="INPUT"||
active.tagName==="TEXTAREA"
)
){

return;

}

if(
e.key==="Delete"||
e.key==="Backspace"
){

if(selectedObject){

selectedObject.remove();

selectedObject=null;

saveHistory();

status("Object deleted.");

e.preventDefault();

}

}

}
);


/* SAVE */

saveBtn.addEventListener(
"click",
exportPDF
);


async function exportPDF(){

if(!originalPdfBytes){

alert(
"Please open a PDF first."
);

return;
}

try{

status("Preparing PDF...");

const pdfDoc=
await PDFLib.PDFDocument.load(
originalPdfBytes
);

const pages=
pdfDoc.getPages();

const helvetica=
await pdfDoc.embedFont(
PDFLib.StandardFonts.Helvetica
);


for(
let i=0;
i<pages.length;
i++
){

const page=pages[i];

const pageElement=
document.querySelector(
`.page[data-page-number="${i+1}"]`
);

if(!pageElement)continue;


/* NEW TEXT */

const texts=
pageElement.querySelectorAll(
".editText"
);

for(const text of texts){

const x=
parseFloat(text.style.left)||0;

const top=
parseFloat(text.style.top)||0;

const fontSize=
parseFloat(
text.style.fontSize
)||14;

const pageHeight=
pageElement.clientHeight;

const y=
pageHeight-top-fontSize;

page.drawText(
text.innerText||"",
{
x:x/zoom,
y:y/zoom,
size:fontSize/zoom,
font:helvetica,
color:PDFLib.rgb(0,0,0)
}
);

}


/* IMAGES */

const images=
pageElement.querySelectorAll(
".imageObj"
);

for(const obj of images){

const img=
obj.querySelector("img");

if(!img||!img.src)continue;

try{

const response=
await fetch(img.src);

const buffer=
await response.arrayBuffer();

let embedded;

if(
img.src.startsWith(
"data:image/png"
)
){

embedded=
await pdfDoc.embedPng(
buffer
);

}else{

embedded=
await pdfDoc.embedJpg(
buffer
);

}

const x=
parseFloat(
obj.style.left
)||0;

const top=
parseFloat(
obj.style.top
)||0;

const width=
obj.getBoundingClientRect()
.width;

const height=
obj.getBoundingClientRect()
.height;

const pageHeight=
pageElement.clientHeight;

page.drawImage(
embedded,
{
x:x/zoom,
y:(pageHeight-top-height)/zoom,
width:width/zoom,
height:height/zoom
}
);

}catch(error){

console.error(
"Image export error:",
error
);

}

}


/* DRAWING */

const drawing=
pageElement.querySelector(
".drawingCanvas"
);

if(drawing){

const dataUrl=
drawing.toDataURL(
"image/png"
);

const response=
await fetch(dataUrl);

const buffer=
await response.arrayBuffer();

const drawingImage=
await pdfDoc.embedPng(
buffer
);

page.drawImage(
drawingImage,
{
x:0,
y:0,
width:page.getWidth(),
height:page.getHeight()
}
);

}

}


/* ROTATION */

if(pageRotation!==0){

pages.forEach(page=>{

const existing=
page.getRotation().angle;

page.setRotation(
PDFLib.degrees(
existing+pageRotation
)
);

});

}


const bytes=
await pdfDoc.save({
useObjectStreams:true
});

const blob=
new Blob(
[bytes],
{
type:"application/pdf"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"Raja-PDF-Edited.pdf";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

status(
"PDF saved successfully."
);

}catch(error){

console.error(error);

alert(
"PDF save failed.\n\n"+
error.message
);

status("Save failed.");

}

}


updateHistoryButtons();
updateZoomText();

</script>

</body>
</html>
