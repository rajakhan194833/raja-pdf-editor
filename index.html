<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redwan PDF Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef2f7;color:#172033;font-family:Arial,sans-serif;overflow-x:hidden}
.header{height:60px;background:#fff;border-bottom:1px solid #dbe3ec;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:1000}
.logo{font-size:20px;font-weight:800}.logo span{color:#2563eb}.status{font-size:13px;color:#64748b}
.toolbar-wrap{background:#fff;border-bottom:1px solid #dbe3ec;padding:10px;position:sticky;top:60px;z-index:999;width:100%}
.toolbar{display:flex;align-items:center;gap:8px;width:100%;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{height:42px !important;min-width:105px !important;max-width:105px !important;width:105px !important;border:0;border-radius:8px;padding:0 6px;display:inline-flex !important;align-items:center !important;justify-content:center !important;gap:5px;color:#fff;font-weight:600;font-size:12px;cursor:pointer;box-shadow:0 2px 4px rgba(15,23,42,0.1);transition:0.16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.tool:hover{transform:translateY(-1px);filter:brightness(1.08)}.tool:active{transform:scale(0.96)}
.add{background:#16a34a}.image{background:#9333ea}.undo{background:#64748b}.redo{background:#be123c}.rotate{background:#0891b2}.fontbox{background:#7c3aed}.save{background:#059669}
select.tool{appearance:auto;cursor:pointer;text-align:left}
.zoom-group{height:42px !important;min-width:105px !important;max-width:105px !important;width:105px !important;background:#0f172a;border-radius:8px;display:inline-flex !important;align-items:center;gap:4px;padding:0 8px;justify-content:space-between;flex-shrink:0}
.zoom-percent{color:#fff;font-size:11px;font-weight:700;min-width:32px;text-align:center}
.zoom-icon-btn{background:none;border:0;color:#cbd5e1;padding:2px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.zoom-icon-btn:hover{color:#fff}.zoom-icon-btn svg{width:14px;height:14px}
.save-menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 8px 30px rgba(15,23,42,0.2);z-index:2000;display:none;min-width:150px;overflow:hidden}
.save-menu.show{display:block}
.save-menu button{width:100%;padding:12px 16px;border:0;background:#fff;color:#172033;font-weight:600;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:0.15s}
.save-menu button:hover{background:#f1f5f9}
.save-menu button.pdf{border-left:4px solid #059669}
.save-menu button.word{border-left:4px solid #2563eb}
.save-menu button.jpg{border-left:4px solid #0f766e}
.workspace{padding:28px;min-height:calc(100vh - 120px)}
.empty{min-height:65vh;display:flex;align-items:center;justify-content:center}
.empty-card{background:#fff;border:1px solid #dbe3ec;border-radius:18px;padding:50px 60px;text-align:center;box-shadow:0 12px 40px rgba(15,23,42,0.08)}
.empty-icon{font-size:48px;margin-bottom:12px}.empty-card h2{margin:0 0 8px}.empty-card p{margin:0;color:#64748b}
.pages{display:flex;flex-direction:column;align-items:center;gap:28px}
.page-holder{position:relative;background:#fff;box-shadow:0 8px 30px rgba(15,23,42,0.15);overflow:hidden;flex:none;margin-bottom:20px}
.page-canvas{display:block;background:#fff}
.text-layer,.object-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* ✅ টেক্সট এডিটিং - ফিক্সড */
.pdf-text{
  position:absolute;
  pointer-events:auto;
  white-space:pre;
  color:transparent;
  background:transparent;
  border:1px solid transparent;
  margin:0;
  padding:2px 4px;
  line-height:1.2;
  cursor:text;
  border-radius:3px;
  outline:none;
  transition:all 0.15s;
  user-select:text;
  z-index:10;
}
.pdf-text:hover{
  border:1px dashed #2563eb !important;
  background:rgba(37,99,235,0.08) !important;
}
.pdf-text.editing{
  color:#000000 !important;
  background:#ffffff !important;
  border:2px solid #2563eb !important;
  z-index:100 !important;
  box-shadow:0 0 0 3px rgba(37,99,235,0.2) !important;
  padding:3px 5px;
  caret-color:#000;
}

.new-text{position:absolute;z-index:60;min-width:60px;min-height:24px;padding:3px 6px;background:#fff;border:2px solid #2563eb;border-radius:3px;outline:none;white-space:pre-wrap;cursor:text;box-shadow:0 0 0 3px rgba(37,99,235,0.2);color:#111827}
.image-object{position:absolute;z-index:70;border:1px dashed transparent;cursor:move}
.image-object.selected{border:2px solid #9333ea}
.image-object img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.resize-handle{display:none;position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:#9333ea;border:2px solid #fff;border-radius:50%;cursor:nwse-resize}
.image-object.selected .resize-handle{display:block}
.notice{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 15px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:0.2s;z-index:5000}
.notice.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.toolbar{overflow-x:auto;-webkit-overflow-scrolling:touch}.tool,.zoom-group{min-width:90px !important;max-width:90px !important;width:90px !important;font-size:11px;height:38px !important}}
</style>
</head>
<body>
<header class="header">
  <div class="logo">Redwan <span>PDF Editor</span></div>
  <div class="status" id="status">Ready</div>
</header>
<div class="toolbar-wrap">
  <div class="toolbar">
    <label class="tool add"> Add File<input id="fileInput" hidden type="file" accept=".pdf"></label>
    <label class="tool image">🖼️ Image<input id="imageInput" hidden type="file" accept="image/*"></label>
    <button class="tool undo" id="undoBtn">↶ Undo</button>
    <button class="tool redo" id="redoBtn">↷ Redo</button>
    <button class="tool rotate" id="rotateBtn"> Rotate</button>
    <select class="tool fontbox" id="fontSizeSelect"></select>
    <div class="zoom-group">
      <button class="zoom-icon-btn" id="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <div class="zoom-percent" id="zoomValue">100%</div>
      <button class="zoom-icon-btn" id="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    </div>
    <button class="tool save" id="saveBtn">💾 Save</button>
  </div>
</div>
<div class="save-menu" id="saveMenu">
  <button class="pdf" onclick="saveAs('pdf')">💾 Save PDF</button>
  <button class="word" onclick="saveAs('word')">📄 Save Word</button>
  <button class="jpg" onclick="saveAs('jpg')">🖼️ Save JPG</button>
</div>
<main class="workspace">
  <div class="empty" id="emptyState"><div class="empty-card"><div class="empty-icon">📄</div><h2>Free Edit your PDF</h2><p>Click <b>📂 Add File</b> to open your PDF.</p></div></div>
  <div class="pages" id="pages"></div>
</main>
<div class="notice" id="notice"></div>
<script>
const S={pdf:null,originalBytes:null,pages:[],zoom:1,rotation:0,selectedImage:null,history:[],future:[],activeText:null,fonts:{},currentFont:'Helvetica',currentSize:12};
const $=id=>document.getElementById(id);
const pagesEl=$("pages"),emptyState=$("emptyState"),statusEl=$("status"),noticeEl=$("notice");

function toast(msg){noticeEl.textContent=msg;noticeEl.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>noticeEl.classList.remove("show"),2500);}
function status(msg){statusEl.textContent=msg;}
function clone(obj){return JSON.parse(JSON.stringify(obj));}
function snapshot(){return clone({pages:S.pages,rotation:S.rotation});}
function pushHistory(){S.history.push(snapshot());if(S.history.length>40)S.history.shift();S.future=[];}

async function loadFonts(){
  if(Object.keys(S.fonts).length>0)return;
  try{
    status("Loading fonts...");
    const urls={bengali:'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansBengali/NotoSansBengali-Regular.ttf',arabic:'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf'};
    for(const[key,url]of Object.entries(urls)){const res=await fetch(url);const buf=await res.arrayBuffer();S.fonts[key+'_bytes']=new Uint8Array(buf);}
    status("Fonts ready");
  }catch(e){console.warn("Font load failed",e);}
}

function buildFontSelect(){
  const sel=$("fontSizeSelect");sel.innerHTML="";
  const fonts=[
    {label:"Arial 10",font:"Helvetica",size:10},{label:"Arial 12",font:"Helvetica",size:12},
    {label:"Arial 14",font:"Helvetica",size:14},{label:"Arial 16",font:"Helvetica",size:16},
    {label:"Arial 18",font:"Helvetica",size:18},{label:"Arial 24",font:"Helvetica",size:24},
    {label:"Times 12",font:"Times",size:12},{label:"Times 16",font:"Times",size:16},
    {label:"বাংলা 12",font:"NotoSansBengali",size:12},{label:"বাংলা 16",font:"NotoSansBengali",size:16},
    {label:"বাংলা 24",font:"NotoSansBengali",size:24},{label:"عربي 12",font:"NotoSansArabic",size:12},
    {label:"عربي 16",font:"NotoSansArabic",size:16},{label:"عربي 24",font:"NotoSansArabic",size:24}
  ];
  fonts.forEach(f=>{const opt=document.createElement("option");opt.value=JSON.stringify({font:f.font,size:f.size});opt.textContent=f.label;if(f.font===S.currentFont&&f.size===S.currentSize)opt.selected=true;sel.appendChild(opt);});
}
buildFontSelect();
$("fontSizeSelect").addEventListener("change",()=>{const v=JSON.parse($("fontSizeSelect").value);S.currentFont=v.font;S.currentSize=v.size;if(S.activeText){pushHistory();S.activeText.style.fontFamily=v.font+",sans-serif";S.activeText.style.fontSize=v.size*S.zoom+"px";saveExistingText(S.activeText);}});

$("fileInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith(".pdf")){toast("Please choose a PDF file");return;}try{status("Opening PDF...");S.originalBytes=new Uint8Array(await file.arrayBuffer());S.pdf=await pdfjsLib.getDocument({data:S.originalBytes.slice()}).promise;S.pages=[];S.history=[];S.future=[];S.rotation=0;S.zoom=1;for(let i=0;i<S.pdf.numPages;i++)S.pages.push({texts:[],newTexts:[],images:[]});emptyState.style.display="none";await renderAll();status("PDF loaded");toast("PDF opened");}catch(err){console.error(err);status("Open failed");toast("PDF could not be opened");}});

async function renderAll(){pagesEl.innerHTML="";if(!S.pdf)return;for(let n=1;n<=S.pdf.numPages;n++)await renderPage(n);$("zoomValue").textContent=Math.round(S.zoom*100)+"%";}

async function renderPage(n){
  const page=await S.pdf.getPage(n);
  const view=page.getViewport({scale:S.zoom,rotation:S.rotation});
  const holder=document.createElement("div");holder.className="page-holder";holder.dataset.page=n;
  holder.style.width=view.width+"px";holder.style.height=view.height+"px";
  const canvas=document.createElement("canvas");canvas.className="page-canvas";canvas.width=Math.ceil(view.width);canvas.height=Math.ceil(view.height);
  canvas.style.width=view.width+"px";canvas.style.height=view.height+"px";
  await page.render({canvasContext:canvas.getContext("2d"),viewport:view}).promise;
  holder.appendChild(canvas);
  const textLayer=document.createElement("div");textLayer.className="text-layer";holder.appendChild(textLayer);
  const objectLayer=document.createElement("div");objectLayer.className="object-layer";holder.appendChild(objectLayer);
  const ps=S.pages[n-1];
  const content=await page.getTextContent();
  
  content.items.forEach((item,index)=>{
    if(!item.str)return;
    const t=item.transform;
    const x=t[4],y=t[5];
    const rawSize=Math.abs(t[3])||Math.abs(item.height)||12;
    const edited=ps.texts.find(x=>x.index===index);
    
    const el=document.createElement("div");
    el.className="pdf-text";
    el.dataset.page=n;
    el.dataset.index=index;
    el.textContent=edited?edited.text:item.str;
    el.style.left=(x*S.zoom)+"px";
    el.style.top=(y*S.zoom-rawSize*S.zoom)+"px";
    el.style.fontSize=(edited?.size||rawSize)*S.zoom+"px";
    el.style.fontFamily=(edited?.font||"Arial")+",sans-serif";
    el.style.minWidth=(item.width||20)*S.zoom+"px";
    el.style.minHeight=rawSize*S.zoom+"px";
    el.contentEditable="false";
    
    el.addEventListener("click",function(e){
      e.stopPropagation();
      activateText(this);
    });
    
    el.addEventListener("input",function(){
      saveExistingText(this);
    });
    
    el.addEventListener("blur",function(){
      this.contentEditable="false";
      this.classList.remove("editing");
      this.style.color="transparent";
    });
    
    el.addEventListener("keydown",function(e){
      if(e.key==="Escape")this.blur();
    });
    
    textLayer.appendChild(el);
  });
  
  ps.newTexts.forEach(obj=>createNewText(holder,n,obj));
  ps.images.forEach(obj=>createImage(holder,n,obj));
  
  holder.addEventListener("dblclick",e=>{
    if(e.target.classList.contains("pdf-text")||e.target.classList.contains("new-text")||e.target.classList.contains("image-object"))return;
    const r=holder.getBoundingClientRect();
    const obj={id:"new_"+Date.now()+"_"+Math.random(),x:(e.clientX-r.left)/S.zoom,y:(e.clientY-r.top)/S.zoom,text:"",font:S.currentFont,size:S.currentSize};
    pushHistory();ps.newTexts.push(obj);createNewText(holder,n,obj);
    setTimeout(()=>{const el=holder.querySelector(`[data-new-id="${obj.id}"]`);if(el)el.focus();},20);
  });
  
  pagesEl.appendChild(holder);
}

function activateText(el){
  if(S.activeText&&S.activeText!==el){
    S.activeText.contentEditable="false";
    S.activeText.classList.remove("editing");
    S.activeText.style.color="transparent";
  }
  S.activeText=el;
  el.contentEditable="true";
  el.classList.add("editing");
  el.style.color="#000000";
  el.focus();
  
  setTimeout(()=>{
    try{
      const range=document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){console.log("Selection error:",e);}
  },50);
}

function saveExistingText(el){
  const page=Number(el.dataset.page);
  const index=Number(el.dataset.index);
  const ps=S.pages[page-1];
  let obj=ps.texts.find(t=>t.index===index);
  if(!obj){pushHistory();obj={index,text:"",font:"Arial",size:12};ps.texts.push(obj);}
  obj.text=el.innerText.replace(/\n/g,"");
  obj.font=S.currentFont;
  obj.size=S.currentSize;
}

function createNewText(holder,n,obj){
  const el=document.createElement("div");
  el.className="new-text";
  el.dataset.newId=obj.id;
  el.contentEditable="true";
  el.textContent=obj.text||"";
  el.style.left=obj.x*S.zoom+"px";
  el.style.top=obj.y*S.zoom+"px";
  el.style.fontFamily=obj.font+",sans-serif";
  el.style.fontSize=(obj.size||12)*S.zoom+"px";
  el.addEventListener("input",()=>{obj.text=el.innerText;});
  el.addEventListener("focus",()=>{S.activeText=el;});
  el.addEventListener("blur",()=>{el.classList.remove("editing");});
  el.addEventListener("keydown",e=>{if(e.key==="Escape")el.blur();});
  holder.querySelector(".object-layer").appendChild(el);
}

$("imageInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file||!S.pdf)return;pushHistory();const ps=S.pages[0];const obj={id:"img_"+Date.now(),src:URL.createObjectURL(file),x:60,y:60,width:180,height:130};ps.images.push(obj);const holder=document.querySelector('.page-holder[data-page="1"]');if(holder)createImage(holder,1,obj);toast("Image added");});

function createImage(holder,n,obj){
  const box=document.createElement("div");box.className="image-object";box.dataset.imageId=obj.id;
  box.style.left=obj.x*S.zoom+"px";box.style.top=obj.y*S.zoom+"px";
  box.style.width=obj.width*S.zoom+"px";box.style.height=obj.height*S.zoom+"px";
  const img=document.createElement("img");img.src=obj.src;
  const handle=document.createElement("div");handle.className="resize-handle";
  box.appendChild(img);box.appendChild(handle);
  box.addEventListener("mousedown",e=>{if(e.target===handle)return;document.querySelectorAll(".image-object").forEach(x=>x.classList.remove("selected"));box.classList.add("selected");S.selectedImage=box;const sx=e.clientX,sy=e.clientY,ox=obj.x,oy=obj.y;function move(ev){obj.x=ox+(ev.clientX-sx)/S.zoom;obj.y=oy+(ev.clientY-sy)/S.zoom;box.style.left=obj.x*S.zoom+"px";box.style.top=obj.y*S.zoom+"px";}function up(){document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);}document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);});
  handle.addEventListener("mousedown",e=>{e.stopPropagation();pushHistory();const sx=e.clientX,sy=e.clientY,ow=obj.width,oh=obj.height;function move(ev){const nw=Math.max(30,ow+(ev.clientX-sx)/S.zoom);const ratio=oh/ow;obj.width=nw;obj.height=nw*ratio;box.style.width=obj.width*S.zoom+"px";box.style.height=obj.height*S.zoom+"px";}function up(){document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);}document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);});
  holder.querySelector(".object-layer").appendChild(box);
}

$("undoBtn").addEventListener("click",()=>{if(!S.history.length){toast("Nothing to undo");return;}S.future.push(snapshot());const previous=S.history.pop();S.pages=clone(previous.pages);S.rotation=previous.rotation;renderAll();toast("Undone");});
$("redoBtn").addEventListener("click",()=>{if(!S.future.length){toast("Nothing to redo");return;}S.history.push(snapshot());const next=S.future.pop();S.pages=clone(next.pages);S.rotation=next.rotation;renderAll();toast("Redone");});
$("rotateBtn").addEventListener("click",()=>{if(!S.pdf){toast("Open a PDF first");return;}pushHistory();S.rotation=(S.rotation+90)%360;renderAll();toast("Rotated 90°");});
function setZoom(z){z=Math.max(0.5,Math.min(3,z));S.zoom=z;renderAll();$("zoomValue").textContent=Math.round(z*100)+"%";}
$("zoomIn").addEventListener("click",()=>setZoom(S.zoom+0.1));$("zoomOut").addEventListener("click",()=>setZoom(S.zoom-0.1));
document.addEventListener("keydown",e=>{if(e.key!=="Delete"&&e.key!=="Backspace")return;const active=document.activeElement;if(active&&(active.isContentEditable||active.tagName==="INPUT"||active.tagName==="TEXTAREA"))return;if(!S.selectedImage)return;const id=S.selectedImage.dataset.imageId;for(const ps of S.pages){const i=ps.images.findIndex(x=>x.id===id);if(i!==-1){pushHistory();ps.images.splice(i,1);S.selectedImage=null;renderAll();toast("Image deleted");return;}}});

$("saveBtn").addEventListener("click",()=>{$("saveMenu").classList.toggle("show");});
document.addEventListener("click",e=>{if(!e.target.closest("#saveBtn")&&!e.target.closest("#saveMenu")){$("saveMenu").classList.remove("show");}});

async function saveAs(format){
  $("saveMenu").classList.remove("show");
  if(!S.originalBytes){toast("Open a PDF first");return;}
  if(format==='jpg'){await saveAsJPG();return;}
  if(format==='word'){await saveAsWord();return;}
  if(format==='pdf'){await saveAsPDF();return;}
}

async function saveAsJPG(){if(!S.pdf){toast("Open a PDF first");return;}const canvases=document.querySelectorAll(".page-canvas");if(!canvases.length){toast("Nothing to export");return;}status("Exporting JPG...");for(let i=0;i<canvases.length;i++){const canvas=canvases[i];await new Promise(resolve=>{canvas.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Redwan-PDF-page-"+(i+1)+".jpg";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);resolve();},"image/jpeg",0.95);});await new Promise(r=>setTimeout(r,300));}status("JPG exported");toast("✓ Saved as JPG");}

async function saveAsWord(){if(!S.pdf){toast("Open a PDF first");return;}const btn=$("saveBtn");const old=btn.innerHTML;try{btn.disabled=true;btn.innerHTML="⏳ Building...";status("Building Word file...");let bodyHtml="";for(let p=0;p<S.pages.length;p++){const pdfjsPage=await S.pdf.getPage(p+1);const viewport=pdfjsPage.getViewport({scale:1,rotation:0});const w=viewport.width;const h=viewport.height;bodyHtml+='<div style="position:relative;width:'+w+'pt;height:'+h+'pt;margin:0 0 24pt 0;border:1px solid #ccc;page-break-after:always;">';const content=await pdfjsPage.getTextContent();const ps=S.pages[p];content.items.forEach((item,index)=>{if(!item.str)return;const edited=ps.texts.find(x=>x.index===index);const text=edited?edited.text:item.str;if(!text)return;const t=item.transform;const x=t[4];const y=t[5];const size=(edited&&edited.size)||Math.abs(t[3])||12;const font=(edited&&edited.font)||"Arial";bodyHtml+='<div style="position:absolute;left:'+x+'pt;top:'+(h-y-size)+'pt;font-size:'+size+'pt;font-family:\''+font+'\',sans-serif;white-space:pre;">'+String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</div>';});ps.newTexts.forEach(t=>{if(!t.text)return;bodyHtml+='<div style="position:absolute;left:'+t.x+'pt;top:'+t.y+'pt;font-size:'+t.size+'pt;font-family:\''+(t.font||"Arial")+'\',sans-serif;white-space:pre;">'+String(t.text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</div>';});bodyHtml+='</div>';}const doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Redwan PDF Editor Export</title></head><body>'+bodyHtml+'</body></html>';const blob=new Blob(['\ufeff',doc],{type:"application/msword"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Redwan-PDF-Edited.doc";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status("Word file saved");toast("✓ Saved as Word (.doc)");btn.innerHTML="💾 Save";btn.disabled=false;}catch(err){console.error("WORD SAVE ERROR:",err);btn.innerHTML=" Failed";status("Word export failed");toast("Word export failed");setTimeout(()=>{btn.innerHTML="💾 Save";btn.disabled=false;},2200);}}

async function saveAsPDF(){if(!S.originalBytes){toast("Open a PDF first");return;}const btn=$("saveBtn");const old=btn.innerHTML;try{btn.disabled=true;btn.innerHTML=" Saving...";status("Saving PDF...");await loadFonts();const pdfDoc=await PDFLib.PDFDocument.load(S.originalBytes.slice());const helvetica=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);const bengaliFont=S.fonts['bengali_bytes']?await pdfDoc.embedFont(S.fonts['bengali_bytes']):helvetica;const arabicFont=S.fonts['arabic_bytes']?await pdfDoc.embedFont(S.fonts['arabic_bytes']):helvetica;for(let p=0;p<S.pages.length;p++){const pdfPage=pdfDoc.getPage(p);const ps=S.pages[p];const pageWidth=pdfPage.getWidth();const pageHeight=pdfPage.getHeight();const pdfjsPage=await S.pdf.getPage(p+1);const viewport=pdfjsPage.getViewport({scale:1,rotation:0});const sx=pageWidth/viewport.width;const sy=pageHeight/viewport.height;for(const t of ps.texts){const content=await pdfjsPage.getTextContent();const item=content.items[t.index];if(!item)continue;const x=item.transform[4]*sx;const y=item.transform[5]*sy;const size=Number(t.size)||Math.abs(item.transform[3])||12;const script=/[\u0980-\u09FF]/.test(t.text||item.str)?'bengali':(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(t.text||item.str)?'arabic':'latin');const fontToUse=script==='bengali'?bengaliFont:(script==='arabic'?arabicFont:helvetica);pdfPage.drawRectangle({x:x-2,y:y-size-2,width:Math.max(item.width*sx+8,size*2),height:size+6,color:PDFLib.rgb(1,1,1)});if(t.text)pdfPage.drawText(t.text,{x:x,y:y-size,size:size,font:fontToUse,color:PDFLib.rgb(0,0,0)});}for(const t of ps.newTexts){if(!t.text)continue;const script=/[\u0980-\u09FF]/.test(t.text)?'bengali':(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(t.text)?'arabic':'latin');const fontToUse=script==='bengali'?bengaliFont:(script==='arabic'?arabicFont:helvetica);pdfPage.drawText(t.text,{x:t.x*sx,y:pageHeight-(t.y+t.size)*sy,size:t.size*sy,font:fontToUse,color:PDFLib.rgb(0,0,0)});}for(const im of ps.images){try{const response=await fetch(im.src);const bytes=new Uint8Array(await response.arrayBuffer());let embedded=(im.src.toLowerCase().includes(".jpg")||im.src.toLowerCase().includes(".jpeg"))?await pdfDoc.embedJpg(bytes):await pdfDoc.embedPng(bytes);pdfPage.drawImage(embedded,{x:im.x*sx,y:pageHeight-(im.y+im.height)*sy,width:im.width*sx,height:im.height*sy});}catch(err){console.warn("Image export failed",err);}}}for(const page of pdfDoc.getPages())page.setRotation(PDFLib.degrees(S.rotation));const bytes=await pdfDoc.save({useObjectStreams:true});const blob=new Blob([bytes],{type:"application/pdf"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Redwan-PDF-Edited.pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);btn.innerHTML="✓ Saved";toast("✓ PDF Saved Successfully");setTimeout(()=>{btn.innerHTML="💾 Save";btn.disabled=false;},1800);}catch(err){console.error("PDF SAVE ERROR:",err);btn.innerHTML="⚠ Failed";toast("PDF Save Failed");setTimeout(()=>{btn.innerHTML="💾 Save";btn.disabled=false;},2200);}}
</script>
